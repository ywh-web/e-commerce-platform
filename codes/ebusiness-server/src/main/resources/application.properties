# ============================================================
#  电子商务平台后端服务 —— 主配置文件
#  工程：ebusiness-server
#  启动后访问地址：http://localhost:8443/eBusiness
# ============================================================

# ---------- 服务端口与上下文路径（前端代理指向此处，务必保持一致） ----------
server.port=8443
server.servlet.context-path=/eBusiness
# 请求体大小上限：商品图片上传需要（默认 1MB 偏小）
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- 数据源：MySQL 8 ----------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ebusiness?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
# 连接池（HikariCP，Spring Boot 默认）
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# ---------- Redis：存验证码与登录 token ----------
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
spring.redis.password=
spring.redis.timeout=5000ms
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=2

# ---------- MyBatis-Plus ----------
# 实体所在包，Mapper 接口所在包
mybatis-plus.type-aliases-package=com.ebusiness.entity
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.table-underline=true
# 开发期间打印 SQL，方便调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true

# ---------- 自定义配置：JWT ----------
# token 过期时间：2 小时（单位：秒）
ebusiness.jwt.expiration=7200
# token 签名秘钥（生产环境请替换为随机长字符串）
ebusiness.jwt.secret=ebusiness-platform-jwt-secret-key-2025
# Redis 中"验证码""登录态"的 key 前缀
ebusiness.redis.code-prefix=CODE_
ebusiness.redis.login-prefix=LOGIN_

# ---------- 静态资源：允许上传的图片从磁盘目录映射访问 ----------
ebusiness.upload.path=${user.dir}/src/main/resources/static/upload/
ebusiness.upload.url-prefix=/upload/

# ---------- 日志级别 ----------
logging.level.root=info
logging.level.com.ebusiness=debug
